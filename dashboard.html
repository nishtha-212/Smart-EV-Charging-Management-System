<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard | EV Charge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="components.css">
<script>try{var t=localStorage.getItem("ev-theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-roles="user" data-nav="dashboard.html">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand"><span class="logo"><svg class="icon" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg></span><span>EV Charge<small>Station management</small></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="btn icon-btn menu-btn" id="menuBtn" aria-label="Open navigation"></button>
      <div class="spacer"></div>
      <label class="row role-lbl muted" for="roleSel" style="font-size:.82rem">Role</label>
      <select class="input ctl" id="roleSel" style="width:auto;min-width:130px" aria-label="Demo role">
        <option value="user">EV Driver</option><option value="operator">Station Operator</option><option value="admin">Admin</option>
      </select>
      <button class="btn icon-btn" id="themeBtn" aria-label="Toggle dark and light mode"></button>
    </header>
    <div class="demo-banner">keep it charged.</div>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script src="common.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
